# ============================================================================
# Global Personality Setting
# ============================================================================
# Options: therapist, casual, mean, flirty (any key under text_chat/voice_chat in system_prompts.yaml)
# Can also be switched at runtime from Discord with ">personality <name>".
# This automatically selects the matching prompts from system_prompts.yaml
# To add more: just add new personality sections in system_prompts.yaml
personality: "flirty"

# ============================================================================
# LLM Model Settings
# ============================================================================
model:
  path: "model/psychologistv2-8.0B-Q4_0.gguf"
  tokenizer_path: "rag-models/embeddinggemma-300m"
  n_ctx: 8192  # Context window size (in tokens)
  n_gpu_layers: -1  # -1 = auto-offload all layers to GPU if available
  n_threads: null   # null = auto-detect CPU cores
  use_flash_attn: true
  use_mlock: true
  # Prompt format. "auto" reads it from the GGUF file (recommended).
  # Override with e.g. "llama3.1", "chatML", "mistral", "gemma" if a model's metadata is wrong.
  chat_wrapper: "auto"

llm_service:
  host: "localhost"
  port: 3000
  # Separate small context for judgment / tool selection / query generation / memory,
  # so the main chat context keeps its cache between turns. 0 = share the main context (less VRAM).
  aux_context_size: 4096

backend:
  host: "127.0.0.1"
  port: 8000

discord:
  enabled: true  # false = run backend + dashboard without connecting the bot

# ============================================================================
# Text Chat Settings (Discord text channels)
# ============================================================================
chat:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2024

  # Text Chat Judgment Settings
  judgment:
    enabled: true
    context_messages: 5
    system_prompt: "@judgment.text"  # Judgment prompt (not affected by personality)
    user_prompt: >
      Previous messages:
      {context}

      Latest message:
      {last_message}

      Should Metis respond?

# ============================================================================
# Voice Chat Settings (Discord voice channels)
# ============================================================================
voice:
  # Audio Processing
  stt_model_path: "model/parakeet-tdt-0.6b-v2.nemo"
  tts_voice: "af_heart"  # Options: af_heart, af_sarah, etc.
  tts_lang_code: "a"  # 'a' = American English
  sample_rate: 24000
  listen_timeout: 1  # Seconds of silence before stopping recording
  chunk_duration: 0.25  # How often (seconds) to check whether a speaker has paused
  min_speech_seconds: 0.3  # Ignore clips shorter than this (coughs, clicks)
  tts_speed: 1.0
  name_correction_threshold: 0.70  # Minimum similarity (0.0-1.0) for fuzzy name matching
  # Input gain for captured audio (1.0 = 100%, 2.0 = 200%). This scales only the bot's input capture.
  input_gain: 2.0
  # Minimum RMS threshold for speech to be considered valid for transcription.
  # Values are linear (0.0 - 1.0). 0.01 is a good default; increase if noise triggers false positives.
  min_rms: 0.01
  # If true, discard user speech that occurs while the AI is talking (prevents responding to old messages)
  # If false, queue user speech and process after AI finishes speaking
  discard_while_speaking: true

  # Voice Chat Judgment Settings
  judgment:
    enabled: true
    context_messages: 5
    system_prompt: "@judgment.voice"  # Judgment prompt (not affected by personality)
    user_prompt: >
      Previous voice messages:
      {context}

      Latest voice input:
      {last_message}

      Should Metis respond? Reply with "positive" or "negative".


# ============================================================================
# Memory (continuous learning about people)
# ============================================================================
memory:
  # Learn from the conversation every N user messages (also on >reset, when old
  # messages are dropped, and on shutdown). Facts are stored per Discord user in
  # memory/people.json and mirrored to memory/long_term/people/ for the knowledge base.
  learn_every_messages: 6
  max_facts_per_person: 80

rag:
  enabled: true
  folders_to_index:
    - "C:\\Users\\saval\\Documents\\Obsidian Vault\\Notes"
    - "memory\\long_term"
  # Optional: add more folders as needed
  collection_name: "metis_knowledge"
  chunk_size: 750  # Chunk size for RAG splitting
  chunk_overlap: 75  # Overlap between chunks when splitting
  top_k: 6  # Number of relevant chunks to retrieve from vector DB
  max_distance: 1.5  # Maximum distance threshold - contexts farther than this are considered irrelevant (-1 = no threshold)
  embedding_model: "rag-models/embeddinggemma-300m"  # Local folder path relative to project root
  persist_directory: ".chromadb"
  query_context_messages: 3  # Number of previous messages to use for contextual query generation (0 = use last message only)

  # Reranker settings
  use_reranker: true  # Enable/disable reranking
  reranker_model: "rag-models/bge-reranker-base"  # Local folder path to reranker model
  reranker_top_k: 2  # Number of top chunks to keep after reranking (must be <= top_k)
  reranker_min_score: 0.1  # Minimum rerank score threshold - contexts with lower scores are filtered out (-1 = no threshold)
  reranker_device: "cpu"  # cpu | cuda | auto (cpu keeps VRAM free for the LLM)

  # Query generation (used by knowledge_search in text chat, and by the plain RAG fallback)
  query_generation_count: 3
  query_generation_system_prompt: "@rag.query_generation_system"
  query_generation_user_prompt: "@rag.query_generation_user"

# ============================================================================
# Tool System Settings
# ============================================================================
tools:
  # Enable/disable the tool system (if disabled, falls back to legacy RAG)
  enabled: true

  # Number of previous messages to use for tool selection context
  context_messages: 3

  # Maximum tools that can be selected per request (voice chat always uses 1)
  max_tools: 3

  # Individual tool settings
  knowledge_search:
    enabled: true
    # Expand the selector's query into rag.query_generation_count extra queries with the LLM
    # (better recall, one extra LLM call). Always skipped in voice chat for latency.
    expand_queries: true

  # Web search using DuckDuckGo (no server or Docker needed)
  web_search:
    enabled: true
    read_top_result: true          # also read the best result's page (text chat)
    read_top_result_voice: false   # skipped in voice chat for latency
    top_result_chars: 2500

  # Reads web pages (links people share are opened automatically). Private/local
  # addresses are always refused.
  fetch_webpage:
    enabled: true
    max_chars: 4000
