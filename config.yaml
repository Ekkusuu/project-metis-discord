# ============================================================================
# Global Personality Setting
# ============================================================================
# Options: therapist, casual, mean
# This automatically selects the matching prompts from system_prompts.yaml
# To add more: just add new personality sections in system_prompts.yaml
personality: "therapist"

# ============================================================================
# LLM Model Settings
# ============================================================================
model:
  path: "model/psychologistv2-8.0B-Q4_0.gguf"
  tokenizer_path: "rag-models/embeddinggemma-300m"
  n_ctx: 8192  # Context window size (in tokens)
  n_gpu_layers: -1  # -1 = auto-offload all layers to GPU if available
  n_threads: null   # null = auto-detect CPU cores
  use_flash_attn: true
  use_mlock: true

llm_service:
  host: "localhost"
  port: 3000

# ============================================================================
# Text Chat Settings (Discord text channels)
# ============================================================================
chat:
  temperature: 0.7
  top_p: 0.95
  max_tokens: 2024

  # Text Chat Judgment Settings
  judgment:
    enabled: true
    context_messages: 5
    system_prompt: "@judgment.text"  # Judgment prompt (not affected by personality)
    user_prompt: >
      Previous messages:
      {context}
      
      Latest message:
      {last_message}
      
      Should Metis respond?

# ============================================================================
# Voice Chat Settings (Discord voice channels)
# ============================================================================
voice:
  # Audio Processing
  stt_model_path: "model/parakeet-tdt-0.6b-v2.nemo"
  tts_voice: "af_heart"  # Options: af_heart, af_sarah, etc.
  tts_lang_code: "a"  # 'a' = American English
  sample_rate: 24000
  listen_timeout: 1  # Seconds of silence before stopping recording
  chunk_duration: 0.5  # Audio chunk duration in seconds
  name_correction_threshold: 0.70  # Minimum similarity (0.0-1.0) for fuzzy name matching
  # Input gain for captured audio (1.0 = 100%, 2.0 = 200%). This scales only the bot's input capture.
  input_gain: 2.0
  # Minimum RMS threshold for speech to be considered valid for transcription.
  # Values are linear (0.0 - 1.0). 0.01 is a good default; increase if noise triggers false positives.
  min_rms: 0.01
  # If true, discard user speech that occurs while the AI is talking (prevents responding to old messages)
  # If false, queue user speech and process after AI finishes speaking
  discard_while_speaking: true
  
  # Voice Chat Judgment Settings
  judgment:
    enabled: true
    context_messages: 5
    system_prompt: "@judgment.voice"  # Judgment prompt (not affected by personality)
    user_prompt: >
      Previous voice messages:
      {context}
      
      Latest voice input:
      {last_message}
      
      Should Metis respond? Reply with "positive" or "negative".


memory:
  temp_memory_token_limit: 1000  # Tokens before auto-summarization to long_term 
  long_term_memory_token_limit: 1000  # Token limit per long-term memory file before creating a new one 

rag:
  enabled: true
  folders_to_index:
    - "C:\\Users\\saval\\Documents\\Obsidian Vault\\Notes"
    - "memory\\long_term"
  # Optional: add more folders as needed
  collection_name: "metis_knowledge"
  chunk_size: 750  # Chunk size for RAG splitting 
  chunk_overlap: 75  # Overlap between chunks when splitting 
  top_k: 6  # Number of relevant chunks to retrieve from vector DB
  max_distance: 1.5  # Maximum distance threshold - contexts farther than this are considered irrelevant (-1 = no threshold)
  embedding_model: "rag-models/embeddinggemma-300m"  # Local folder path relative to project root
  persist_directory: ".chromadb"
  query_context_messages: 3  # Number of previous messages to use for contextual query generation (0 = use last message only)
  
  # Reranker settings
  use_reranker: true  # Enable/disable reranking
  reranker_model: "rag-models/bge-reranker-base"  # Local folder path to reranker model
  reranker_top_k: 2  # Number of top chunks to keep after reranking (must be <= top_k)
  reranker_min_score: 0.1  # Minimum rerank score threshold - contexts with lower scores are filtered out (-1 = no threshold)
  
  # RAG Query Generation
  query_generation_count: 3
  query_generation_system_prompt: "@rag.query_generation_system"
  query_generation_user_prompt: "@rag.query_generation_user"

# ============================================================================
# Memory System Settings
# ============================================================================
prompts:
  memory_summarization_system: "@memory.summarization_system"
  memory_summarization_user: "@memory.summarization_user"
